# Nav2 params -- Week 3 "click goal, robot drives there" MVP,
# + Week 6 Phase B obstacle_layer added on top (see jetson/slam/stereo_depth_argus.launch.py
# for the PointCloud2 source this layer consumes -- /stereo/points2, published in
# left_camera_optical_frame, requires that launch file's base_link->camera static TF
# to be correct before obstacle positions in the costmap are spatially trustworthy).
#
# Deliberately NOT running map_server/amcl: this robot has no map yet (vo_pose
# scale bug is unresolved and deliberately deferred, see project memory), so
# there's nothing to localize against. global_frame is set to "odom" instead
# of "map" everywhere below.
#
# Known limitation, accepted on purpose (not a bug to fix this week): odom
# drifts unbounded over time with no correction, so the planner's idea of
# "global" silently drifts from the real world the longer the robot runs.
# Fine for a short single-goal test drive; would need real localization
# (map + AMCL, or a fixed vo_pose) before trusting this over long runs.
#
# obstacle_layer added 2026-08-11, NOT YET TESTED on hardware -- first thing to
# verify once /stereo/points2 is live: does the costmap actually clear to free
# space where there's genuinely nothing (clearing:true), or does camera/disparity
# noise leave phantom obstacle cells that never clear? min_obstacle_height is set
# to filter the floor plane out of the point cloud based on height alone --
# untested assumption, revisit if the floor itself shows up as "obstacle".
#
# Robot physical constants (from esp32/motor_f1/main/motor_f1.c):
#   wheel diameter 0.06m, wheelbase 0.10m -> robot_radius below is a
#   conservative estimate (not yet measured off the real chassis).

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.15
      stateful: true

    # DIAGNOSTIC SWAP (temporary): RegulatedPurePursuitController accepted goals and
    # received a valid global /plan every cycle, but never produced a /local_plan or
    # any /cmd_vel at all -- no exception, no error logged, robot never moved, even
    # after disabling use_collision_detection. Swapping to DWB as a differential test:
    # if DWB ALSO stays silent, the fault is in shared Nav2/costmap infrastructure, not
    # RPP specifically; if DWB works, keep it and stop chasing RPP. See project history
    # for the full debug trail (nav2_params.yaml commit history / conversation log).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: false
      allow_unknown: true
      tolerance: 0.2

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    # default_nav_to_pose_bt_xml intentionally omitted -> nav2_bt_navigator
    # falls back to its own default tree
    # (navigate_to_pose_w_replanning_and_recovery.xml), which is fine here:
    # its recoveries (spin/backup/wait) don't depend on obstacle data.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.10
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: stereo_points
        stereo_points:
          topic: /stereo/points2
          sensor_frame: ""
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # No static map to size the global costmap against, so it rolls with
      # the robot too -- width/height just needs to comfortably cover
      # start-to-goal distance for a single test drive (a few meters).
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.10
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: stereo_points
        stereo_points:
          topic: /stereo/points2
          sensor_frame: ""
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
      always_send_full_costmap: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
